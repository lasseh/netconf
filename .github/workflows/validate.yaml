name: Validate

# Go, the linter and the list of known vulnerabilities change without a
# commit here, so this runs by the week as well.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - run: make lint

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: make actionlint

  # The two Go releases the README says are supported.
  test:
    name: Unit Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go install gotest.tools/gotestsum@latest
      - run: make build build-linux
      - run: make test
      - run: make tidy
      - run: make docs-check

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vulncheck

  integration:
    name: Integration Tests (netopeer2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make integration-netopeer2
